<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compteur</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }
    #count {
      font-size: clamp(5rem, 28vw, 24rem);
      font-weight: bold;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="count">…</div>

  <script>
    async function refresh() {
      try {
        const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
        const d = await r.json();
        if (d.followers > 0) {
          document.getElementById("count").textContent =
            d.followers.toLocaleString("fr-FR");
        }
      } catch (e) {
        /* on garde le dernier chiffre affiché */
      }
    }
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
